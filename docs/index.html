<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d747a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Untis Homework">
  <title>Untis Homework</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #edf2f5;
      --bg-start: #f8fafb;
      --bg-end: #e9eef1;
      --panel: rgba(255, 255, 255, 0.86);
      --surface: rgba(255, 255, 255, 0.74);
      --surface-soft: rgba(255, 255, 255, 0.58);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --input-bg: #ffffff;
      --ink: #172126;
      --muted: #64727b;
      --line: rgba(120, 137, 148, 0.24);
      --accent: #0d747a;
      --accent-2: #169590;
      --accent-ink: #f7ffff;
      --late: #af3649;
      --late-bg: #fff2f3;
      --done: #4c7555;
      --done-bg: #f2f7f3;
      --shadow: 0 14px 34px rgba(31, 42, 55, 0.12);
      --card-shadow: 0 7px 18px rgba(31, 42, 55, 0.08);
      --custom-bg-image: none;
      --domain-bg-color: rgba(255, 255, 255, 0.94);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f2024;
        --bg-start: #10171b;
        --bg-end: #16242a;
        --panel: rgba(24, 31, 36, 0.9);
        --surface: rgba(33, 42, 48, 0.84);
        --surface-soft: rgba(30, 39, 45, 0.68);
        --surface-strong: rgba(21, 28, 33, 0.98);
        --input-bg: #11191e;
        --ink: #e7eef2;
        --muted: #a9b8c0;
        --line: rgba(159, 181, 193, 0.25);
        --accent-ink: #062326;
        --late-bg: rgba(175, 54, 73, 0.2);
        --done-bg: rgba(76, 117, 85, 0.22);
        --shadow: 0 16px 38px rgba(0, 0, 0, 0.38);
        --card-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
        --domain-bg-color: rgba(28, 38, 44, 0.94);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(13, 116, 122, 0.14), transparent 32rem),
        linear-gradient(135deg, var(--bg-start) 0%, var(--bg) 46%, var(--bg-end) 100%);
      color: var(--ink);
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image: var(--custom-bg-image);
      background-size: cover;
      background-position: center;
      opacity: 0.18;
      z-index: -1;
    }
    main { max-width: 980px; margin: 0 auto; padding: 18px 14px 32px; }
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }
    h1 { margin: 0; font-size: 1.95rem; line-height: 1.1; font-weight: 720; letter-spacing: 0; }
    .meta { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
    .status {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: var(--card-shadow);
    }
    .status[data-state="loading"] { border-color: #b8c7c9; color: var(--accent); }
    .status[data-state="error"] { border-color: #e1a8ad; background: var(--late-bg); color: var(--late); }
    .controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .language {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 750;
      padding: 4px 9px;
      box-shadow: var(--card-shadow);
    }
    .gear {
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 1.05rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: var(--card-shadow);
    }
    .cancel-alert {
      display: none;
      min-height: 32px;
      border: 1px solid rgba(210, 118, 28, 0.34);
      border-radius: 999px;
      padding: 0 11px;
      background: linear-gradient(135deg, #f58f28, #ffbd63);
      color: #321a04;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 850;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      white-space: nowrap;
    }
    .cancel-alert.show { display: inline-flex; align-items: center; }
    .office-hours-button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 11px;
      background: var(--surface);
      color: var(--accent);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 850;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      white-space: nowrap;
    }
    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 5px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-soft);
      box-shadow: var(--card-shadow);
    }
    .tab {
      min-height: 36px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 750;
      cursor: pointer;
    }
    .tab.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-ink);
      box-shadow: var(--card-shadow);
    }
    .subtabs {
      display: inline-flex;
      gap: 6px;
      margin-bottom: 10px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-soft);
      box-shadow: var(--card-shadow);
    }
    .subtab {
      min-height: 31px;
      border: 0;
      border-radius: 999px;
      padding: 0 12px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 800;
      cursor: pointer;
    }
    .subtab.active {
      background: rgba(13, 116, 122, 0.12);
      color: var(--accent);
    }
    .summary {
      display: grid;
      gap: 3px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }
    .summary-title {
      margin: 0;
      color: var(--ink);
      font-size: 0.9rem;
      font-weight: 850;
      line-height: 1.2;
    }
    .summary-line {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
      line-height: 1.3;
    }
    .panel {
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(16px);
    }
    .section {
      padding: 9px;
      border-bottom: 1px solid var(--line);
    }
    .section:last-child { border-bottom: 0; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 2px 7px;
      width: 100%;
      border: 0;
      background: transparent;
      font: inherit;
      cursor: pointer;
      text-align: left;
    }
    .section-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .chevron {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1;
      transition: transform 140ms ease;
    }
    .section.collapsed .chevron {
      transform: rotate(-90deg);
    }
    .section.collapsed .list {
      display: none;
    }
    h2 {
      margin: 0;
      font-size: 0.86rem;
      line-height: 1.2;
      color: var(--muted);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .count {
      min-width: 2rem;
      text-align: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(13, 116, 122, 0.11);
      color: var(--accent);
      font-weight: 800;
      font-size: 0.78rem;
    }
    .list { display: grid; gap: 6px; }
    .notes-view {
      display: none;
      gap: 10px;
    }
    .notes-view.active { display: grid; }
    .notes-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--card-shadow);
    }
    .notes-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 850;
    }
    .notes-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 650;
    }
    .note-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }
    .note-card {
      display: grid;
      gap: 8px;
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--note-color, #fff7cc);
      box-shadow: var(--card-shadow);
    }
    .note-head {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
    }
    .note-icon {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--surface);
      font-weight: 850;
    }
    .note-title {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 850;
      line-height: 1.2;
    }
    .note-meta {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 750;
    }
    .note-text {
      margin: 0;
      color: var(--ink);
      font-size: 0.88rem;
      line-height: 1.32;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .note-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }
    .homework {
      position: relative;
      display: grid;
      gap: 3px;
      min-width: 0;
      grid-template-columns: 42px minmax(0, 1fr);
      padding: 8px 10px 42px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--domain-bg-color);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      touch-action: pan-y;
      cursor: pointer;
      transition: transform 150ms ease, opacity 150ms ease, background 150ms ease;
    }
    .homework::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: var(--accent);
      z-index: 2;
    }
    .homework > * {
      position: relative;
      z-index: 1;
    }
    .study-icon {
      grid-row: 1 / span 2;
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      align-self: start;
      padding: 0;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(13, 116, 122, 0.13), rgba(22, 149, 144, 0.08));
      color: var(--accent);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 850;
      box-shadow: inset 0 0 0 1px rgba(13, 116, 122, 0.1);
      cursor: pointer;
      overflow: hidden;
    }
    .study-icon img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      padding: 3px;
    }
    .image-picker { display: none; }
    .homework.completed {
      border-color: rgba(76, 117, 85, 0.24);
    }
    .homework.completed::before { background: var(--done); }
    .homework.not-done {
      border-color: rgba(175, 54, 73, 0.22);
    }
    .homework.not-done::before { background: var(--late); }
    .homework.completed .task {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
      text-decoration-color: rgba(76, 117, 85, 0.78);
    }
    .line {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: baseline;
      min-width: 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.2;
    }
    .due { color: var(--ink); font-weight: 760; }
    .posted::before,
    .teacher::before,
    .subject::before,
    .badge::before {
      content: ".";
      margin-right: 5px;
      color: #96a2a9;
    }
    .subject { color: var(--accent); font-weight: 760; }
    .teacher { color: var(--muted); font-weight: 650; }
    .badge { font-weight: 800; }
    .badge.completed { color: var(--done); }
    .badge.not-done { color: var(--late); }
    .task {
      margin: 0;
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-line;
      line-height: 1.2;
      font-size: 0.86rem;
    }
    .action {
      position: absolute;
      bottom: 8px;
      right: 8px;
      min-width: 58px;
      min-height: 27px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--accent);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 800;
      cursor: pointer;
      z-index: 3;
    }
    .homework.completed .action { color: var(--done); }
    .empty {
      margin: 0;
      padding: 11px;
      color: var(--muted);
      background: var(--surface-soft);
      border-radius: 10px;
      font-size: 0.9rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(16, 25, 32, 0.36);
      backdrop-filter: blur(8px);
      z-index: 20;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(420px, 100%);
      max-height: min(86vh, 720px);
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-strong);
      box-shadow: var(--shadow);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .modal.wide { width: min(620px, 100%); }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .modal h2 {
      color: var(--ink);
      font-size: 1rem;
      text-transform: none;
      letter-spacing: 0;
    }
    .close {
      width: 30px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      cursor: pointer;
      font-size: 1rem;
    }
    .form {
      display: grid;
      gap: 10px;
      min-height: 0;
      overflow: auto;
    }
    .field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 750;
    }
    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 7px 10px;
      color: var(--ink);
      font: inherit;
      background: var(--input-bg);
    }
    .field textarea {
      min-height: 96px;
      resize: vertical;
    }
    .field input[type="range"] {
      min-height: auto;
      padding: 0;
    }
    .field input[type="color"] {
      padding: 4px;
      cursor: pointer;
    }
    .save {
      min-height: 38px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .settings-message {
      min-height: 18px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .detail-grid {
      display: grid;
      gap: 10px;
      min-height: 0;
      max-height: min(68vh, 560px);
      overflow: auto;
      padding-right: 4px;
    }
    .detail-grid[data-view="office-hours"] {
      max-height: min(64vh, 520px);
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface-soft);
    }
    .detail-hero {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(13, 116, 122, 0.16), var(--surface));
      border: 1px solid var(--line);
    }
    .teacher-avatar {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--accent-ink);
      font-weight: 850;
    }
    .detail-title {
      margin: 0;
      font-size: 1rem;
      line-height: 1.2;
      font-weight: 850;
    }
    .detail-subtitle {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }
    .detail-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 0.88rem;
    }
    .detail-row:last-child { border-bottom: 0; }
    .detail-label {
      color: var(--muted);
      font-weight: 800;
    }
    .detail-value {
      min-width: 0;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }
    .domain-preview {
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
    }
    .domain-preview .study-icon {
      width: 44px;
      height: 44px;
      cursor: pointer;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .secondary {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 12px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
    }
    .danger {
      color: var(--late);
      border-color: rgba(175, 54, 73, 0.26);
    }
    @media (max-width: 820px) {
      main { padding: 14px 10px 26px; }
      header { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; justify-content: space-between; }
      .status { white-space: normal; }
    }
    @media (max-width: 430px) {
      h1 { font-size: 1.65rem; }
      .homework { grid-template-columns: 38px minmax(0, 1fr); }
      .action { min-width: 50px; font-size: 0.72rem; }
      .detail-row { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <main>
    <p style="color:var(--accent);font-weight:700">OFFLINE DEMO · Fictional homework · No school connection</p>
    <header>
      <div>
        <h1 data-i18n="title">Untis Homework</h1>
        <div class="meta" id="meta">Loading fictional homework...</div>
      </div>
      <div class="controls">
        <select class="language" id="language-select" aria-label="Language">
          <option value="en">EN</option>
          <option value="de">DE</option>
          <option value="fr">FR</option>
        </select>
        <div class="status" id="status" data-state="loading">Refreshing</div>
        <button class="cancel-alert" id="cancel-alert" type="button" data-i18n="cancelledButton">Cancelled</button>
        <button class="office-hours-button" id="office-hours-button" type="button" data-i18n="officeHours">Office hours</button>
        <button class="gear" id="settings-button" type="button" aria-label="Settings">⚙</button>
      </div>
    </header>

    <nav class="tabs" aria-label="Children">
      <button class="tab active" type="button" data-child-tab="child1">Alex</button>
      <button class="tab" type="button" data-child-tab="child2">Robin</button>
    </nav>

    <nav class="subtabs" aria-label="Child space">
      <button class="subtab active" type="button" data-child-view="homework" data-i18n="homeworkTab">Homework</button>
      <button class="subtab" type="button" data-child-view="notes" data-i18n="notesTab">Notes</button>
    </nav>

    <section class="summary" id="progress-summary" aria-live="polite"></section>

    <section class="panel" id="child-panel" aria-live="polite">
      <section class="section">
        <button class="section-head" type="button" data-collapse="homework" aria-expanded="true">
          <span class="section-title"><span class="chevron">▾</span><h2 data-i18n="homework">Homework</h2></span>
          <span class="count" id="open-count">0</span>
        </button>
        <div class="list" id="open-list"></div>
      </section>

      <section class="section archive-section">
        <button class="section-head" type="button" data-collapse="archive" aria-expanded="true">

    function weeklyProgress(homeworks) {
      const today = localDate();
      const weekStart = new Date(today);
      weekStart.setDate(today.getDate() - ((today.getDay() + 6) % 7));
      const weekEnd = new Date(weekStart);
      weekEnd.setDate(weekStart.getDate() + 6);
      const completedDates = new Set();
      let completed = 0;
      let open = 0;
      let missed = 0;
      homeworks.forEach((homework) => {
        const dueDate = parseLocalDate(homework.dueDate);
        const completedDate = parseLocalDate(homework.completedAt || homework.dueDate);
        if (homework.status === "completed" && completedDate) {
          completedDates.add(toIsoDate(completedDate));
          if (dateInRange(completedDate, weekStart, weekEnd)) completed += 1;
        }
        if (homework.status === "open" && dueDate && dateInRange(dueDate, weekStart, weekEnd)) open += 1;
        if (homework.status === "not_done" && dueDate && dateInRange(dueDate, weekStart, weekEnd)) missed += 1;
      });
      return { completed, open, missed, activeDays: recentActiveDays(completedDates, today) };
    }

    function recentActiveDays(completedDates, today) {
      let days = 0;
      for (let index = 0; index < 28; index += 1) {
        const cursor = new Date(today);
        cursor.setDate(today.getDate() - index);
        if (!completedDates.has(toIsoDate(cursor))) continue;
        days += 1;
      }
      return days;
    }

    function templateText(key, values) {

    function dateInRange(value, start, end) {
      return value >= start && value <= end;
    }

    function localDate() {
      const now = new Date("2026-10-13T12:00:00Z");
      return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }

    function parseLocalDate(value) {
      if (!value) return null;
      const [year, month, day] = String(value).split("-").map(Number);
      if (!year || !month || !day) return null;
      return new Date(year, month - 1, day);
    }

    function toIsoDate(value) {
      const year = value.getFullYear();
      const month = String(value.getMonth() + 1).padStart(2, "0");
      const day = String(value.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function renderSubjectIcon(node, subject) {
      const icon = node.querySelector("[data-icon]");
      const key = subjectKey(subject);
      icon.dataset.subjectKey = key;
      const match = subjectIcon(key, subject);
      icon.replaceChildren();
      const childIcons = domainIcons.children?.[activeChild] || {};
      const legacyIcons = domainIcons.icons || {};
      const pickedImage = childIcons[key] || legacyIcons[key];
      if (pickedImage) {
        const image = document.createElement("img");
        image.src = pickedImage;
        image.alt = match.title;
        icon.append(image);
      } else {
        icon.textContent = match.symbol;
      }
      icon.title = match.title;
      let pressTimer = 0;
      let longPressed = false;
      icon.addEventListener("pointerdown", () => {
        longPressed = false;
        pressTimer = window.setTimeout(() => {
          longPressed = true;
          openDomainSettings(key, subject);
        }, 520);
      });
      icon.addEventListener("pointerup", () => window.clearTimeout(pressTimer));
      icon.addEventListener("pointercancel", () => window.clearTimeout(pressTimer));
      icon.addEventListener("click", (event) => {
        event.stopPropagation();
        window.clearTimeout(pressTimer);
        if (!longPressed) openDomainSettings(key, subject);
      });
    }

    function subjectKey(subject) {
      return subject.toUpperCase().replace(/[0-9]/g, "");
    }

    function subjectIcon(key, subject) {
      const icons = {
        M: { symbol: "∑", title: "Mathematics" },
        E: { symbol: "Aa", title: "English" },
        D: { symbol: "ß", title: "German" },
        L: { symbol: "V", title: "Latin" },
        F: { symbol: "Fr", title: "French" },
        GWB: { symbol: "🌍", title: "Geopolitics" },
        KUG: { symbol: "📐", title: "Technical drawing" },
      };
      const fallback = subject.slice(0, 2).toUpperCase() || "•";
      return icons[key] || { symbol: fallback, title: subject || tr("subject") };
    }

    function applyDomainStyle(node, key) {
      const style = domainStyles[activeChild]?.[key] || {};
      node.style.setProperty("--domain-bg-color", style.color ? softenedColor(style.color) : "var(--domain-bg-color)");
    }

    function softenedColor(value) {
      const rgb = hexToRgb(value);
      return rgb ? `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.24)` : "var(--domain-bg-color)";
    }

    function hexToRgb(value) {
      const match = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(value || "");
      if (!match) return null;
      return {
        r: parseInt(match[1], 16),
        g: parseInt(match[2], 16),
        b: parseInt(match[3], 16),
      };
    }

    function matchingOfficeHours(teacher) {
      const needle = normalizeTeacher(teacher);
      if (!needle) return [];
      return (officeHours?.hours || []).filter((row) =>
        [row.teacher, row.teacherFullName].some((value) => normalizeTeacher(value).includes(needle)),
      );
    }

    function normalizeTeacher(value) {
      return String(value || "").trim().toUpperCase();
    }

    function formatOfficeHour(row) {
      const date = row.date ? formatIso(row.date) : tr("none");
      const time = [row.startTime, row.endTime].filter(Boolean).join(" - ");
      const status = row.available ? tr("available") : tr("unavailable");
      const room = row.room ? `${tr("room")}: ${row.room}` : "";
      const phone = row.phone || "";
      const email = row.email || "";
      const note = row.textByNoAppointment || "";
      return [
        row.teacherFullName || row.teacher || tr("teacherContact"),
        `${date}${time ? `, ${time}` : ""}`,
        status,
        room,
        phone,
        email,
        note,
      ].filter(Boolean).join("\n");
    }

    function openOfficeHours() {
      const rows = officeHours?.hours || [];
      detailTitle.textContent = tr("officeHours");
      detailContent.dataset.view = "office-hours";
      detailContent.replaceChildren(
        htmlNode("div", "detail-hero", [
          htmlNode("div", "teacher-avatar", "S"),
          htmlNode("div", "", [
            htmlNode("p", "detail-title", tr("officeHours")),
            htmlNode("div", "detail-subtitle", rows.length ? `${rows.length}` : tr("noOfficeHours")),
          ]),
        ]),
        ...(rows.length ? rows.flatMap(officeHourRows) : [htmlNode("p", "empty", tr("noOfficeHours"))]),
      );
      detailModal.classList.add("open");
    }

    function officeHourRows(row) {
      return [
        detailRow(row.teacherFullName || row.teacher || tr("teacherContact"), formatOfficeHour(row)),
      ];
    }

    async function loadCancellations() {
      const cached = loadCachedCancellations();
      if (cached) {
        cancellations = cached;
        updateCancellationButton();
      }
      try {
        const response = await demoRequest(apiPath("/api/cancelled-lessons"), { cache: "no-store" });
        const result = await response.json();
        if (!response.ok || !result.ok) throw new Error(result.error || "Unable to load cancellations");
        cancellations = result;
        cacheCancellations(result);
        updateCancellationButton();
      } catch {
        updateCancellationButton();
      }
    }

    function loadCachedCancellations() {
      try {
        const cached = JSON.parse(localStorage.getItem(CANCELLATIONS_CACHE_KEY) || "null");
        return cached && cached.ok ? cached : null;
      } catch {
        return null;
      }
    }

    function cacheCancellations(nextPayload) {
      try {
        localStorage.setItem(CANCELLATIONS_CACHE_KEY, JSON.stringify(nextPayload));
      } catch {
        // Cancellations are also best-effort offline data.
      }
    }

    function futureCancellations() {
      const today = todayIso();
      const lessons = cancellations?.children?.[activeChild]?.lessons || [];
      return lessons.filter((lesson) => lesson.date >= today);
    }

    function todayIso() {
      const now = new Date("2026-10-13T12:00:00Z");
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function updateCancellationButton() {
      const lessons = futureCancellations();
      cancelAlert.classList.toggle("show", lessons.length > 0);
      cancelAlert.textContent = lessons.length ? `${tr("cancelledButton")} ${lessons.length}` : tr("cancelledButton");
    }

    function openCancellations() {
      const lessons = futureCancellations();
      detailTitle.textContent = tr("cancelledTitle");
      detailContent.dataset.view = "cancellations";
      detailContent.replaceChildren(
        htmlNode("div", "detail-hero", [
          htmlNode("div", "teacher-avatar", "!"),
          htmlNode("div", "", [
            htmlNode("p", "detail-title", tr("cancelledTitle")),
            htmlNode("div", "detail-subtitle", payload?.children?.[activeChild]?.displayName || activeChild),
          ]),
        ]),
        ...(lessons.length ? lessons.flatMap(cancelledLessonRows) : [htmlNode("p", "empty", tr("noCancellations"))]),
      );
      detailModal.classList.add("open");
    }

    function cancelledLessonRows(lesson) {
      const subject = lesson.subject || tr("subject");
      const teacher = lesson.teacher ? `\n${lesson.teacher}` : "";
      const room = lesson.room ? `\n${tr("room")}: ${lesson.room}` : "";
      const text = lesson.text ? `\n${lesson.text}` : "";
      return [
        detailRow(tr("date"), lesson.date ? formatIso(lesson.date) : tr("none")),
        detailRow(tr("time"), [lesson.startTime, lesson.endTime].filter(Boolean).join(" - ") || tr("none")),
        detailRow(tr("subject"), `${subject}${teacher}${room}${text}`),
      ];
    }

    function detailRow(label, value) {
      return htmlNode("div", "detail-row", [
        htmlNode("div", "detail-label", label),
        htmlNode("div", "detail-value", value),
      ]);
    }

    function htmlNode(tag, className, content) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (Array.isArray(content)) {
        content.forEach((child) => node.append(child));
      } else {
        node.textContent = content || "";
      }
      return node;
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function renderBadge(node, status) {
      const badge = node.querySelector("[data-badge]");
      badge.className = `badge ${status.replace("_", "-")}`;
      badge.textContent = status === "completed" ? tr("completed") : status === "not_done" ? tr("notDone") : tr("open");
    }

    function attachSwipe(node, homework) {
      let startX = 0;
      let currentX = 0;
      let dragging = false;
      let moved = false;
      node.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button, [data-icon]")) return;
        startX = event.clientX;
        currentX = event.clientX;
        dragging = true;
        moved = false;
        node.setPointerCapture(event.pointerId);
      });
      node.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        currentX = event.clientX;
        const delta = Math.max(-110, Math.min(110, currentX - startX));
        moved = moved || Math.abs(delta) > 8;
        node.style.transform = `translateX(${delta}px)`;
        node.style.opacity = String(1 - Math.min(Math.abs(delta) / 300, 0.18));
      });
      node.addEventListener("pointerup", () => {
        if (!dragging) return;
        dragging = false;
        if (moved) node.dataset.suppressClick = "true";
        finishSwipe(node, homework, currentX - startX);
      });
      node.addEventListener("pointercancel", () => resetSwipe(node));
    }

    function finishSwipe(node, homework, delta) {
      if (delta > 82 && homework.status !== "completed") {
        setHomeworkStatus(homework, "completed");
        return;
      }
      if (delta < -82 && homework.status === "completed") {
        setHomeworkStatus(homework, "open");
        return;
      }
      resetSwipe(node);
    }

    function resetSwipe(node) {
      node.style.transform = "";
      node.style.opacity = "";
    }

    async function setHomeworkStatus(homework, status) {
      setStatus("saving", "loading");
      const response = await demoRequest(apiPath("/api/homework-state"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ child: activeChild, id: homework.id, status }),
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        setStatus("saveFailed", "error");
        return;
      }
      await loadHomeworks();
    }

    function formatIso(value) {
      const [year, month, day] = value.split("-");
      return `${day}.${month}.${year}`;
    }

    function formatDueDate(value) {
      const date = new Date(`${value}T12:00:00`);
      const weekday = tr("weekdays")[date.getDay() === 0 ? 6 : date.getDay() - 1];
      const [, month, day] = value.split("-");
      return `${weekday}, ${day}.${month}.`;
    }

    async function loadHomeworks() {
      const cached = loadCachedHomeworks();
      if (cached) {
        payload = cached;
        renderActiveChild();
        metaEl.textContent = `${tr("updated")} ${payload.fetchedAt.replace("T", " ")} · ${formatIso(payload.window.start)} ${tr("to")} ${formatIso(payload.window.end)}`;
        setStatus("offlineCache", "ready");
      }
      setStatus("refreshing", "loading");
      try {
        const response = await demoRequest(apiPath("/api/homeworks"));
        payload = await response.json();
        if (!response.ok || !payload.ok) {
          throw new Error(payload.error || "Unable to load homework");
        }
        cacheHomeworks(payload);
        renderActiveChild();
        metaEl.textContent = `${tr("updated")} ${payload.fetchedAt.replace("T", " ")} · ${formatIso(payload.window.start)} ${tr("to")} ${formatIso(payload.window.end)}`;
        setStatus("live", "ready");
      } catch (error) {
        if (payload) {
          setStatus("offlineCache", "ready");
        } else {
          setStatus("webUntisUnavailable", "error");
          metaEl.textContent = error.message;
        }
      }
    }

    function loadCachedHomeworks() {
      try {
        const cached = JSON.parse(localStorage.getItem(HOMEWORK_CACHE_KEY) || "null");
        return cached && cached.ok ? cached : null;
      } catch {
        return null;
      }
    }

    function cacheHomeworks(nextPayload) {
      try {
        localStorage.setItem(HOMEWORK_CACHE_KEY, JSON.stringify(nextPayload));
      } catch {
        // Large custom images may consume storage; homework cache is best-effort.
      }
    }

    loadServerPreferences();
    loadDomainIcons().then(loadHomeworks);
    loadCancellations();
    loadOfficeHours();
    loadNotes();
  </script>
</body>
</html>
